<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07090d" />
    <meta name="description" content="分享日常、旅行、摄影和工作记录的博客。" />
    <title>日常博客</title>
    <link rel="icon" href="assets/profile.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="daily-body is-loading">
    <a class="skip-link" href="#main">跳到主要内容</a>
    <div class="scroll-progress" aria-hidden="true"><span></span></div>
    <div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>

    <header class="daily-nav" id="daily-nav">
      <a class="daily-brand" href="index.html"><span>D</span><div><strong>日常博客</strong><small>DAILY JOURNAL</small></div></a>
      <nav><a href="#latest">最新</a><a href="#feed">文章</a><a href="index.html">个人主页</a></nav>
      <a class="daily-back" href="index.html">返回简历 <span data-icon="arrow-right"></span></a>
    </header>

    <main id="main">
      <section class="daily-hero" id="latest">
        <img id="feature-image" src="" alt="" />
        <span class="daily-hero__overlay"></span>
        <div class="daily-hero__copy">
          <p>记录值得留下来的普通日子</p>
          <h1>日常不是空白，<span>是生活发生的地方。</span></h1>
          <div><span id="feature-category"></span><span id="feature-date"></span><span id="total-count"></span></div>
        </div>
        <button class="daily-feature" id="feature-card" type="button"><small>最新文章</small><strong id="feature-title"></strong><span id="feature-excerpt"></span><i>阅读全文 →</i></button>
      </section>

      <section class="daily-intro"><p>生活 / 旅行 / 摄影 / 学习 / 工作</p><h2>把每一天里真正值得记住的部分，写得更具体一点。</h2></section>

      <section class="daily-feed" id="feed">
        <header><div><span>ALL STORIES</span><h2>所有日常</h2></div><label class="daily-search"><span data-icon="search"></span><input id="daily-search" type="search" placeholder="搜索文章" /></label></header>
        <div class="daily-filters" id="daily-filters"></div>
        <div class="daily-grid" id="daily-grid"></div>
        <div class="daily-empty" id="daily-empty" hidden><strong>没有找到对应文章</strong><p>换一个分类或搜索词再试。</p></div>
      </section>

      <section class="daily-ending"><div><span>KEEP IN TOUCH</span><h2>下一次更新，也许就是今天。</h2><p>文章发布后会出现在这里。</p></div><a class="button button--accent" href="index.html">返回个人主页 <span data-icon="arrow-right"></span></a></section>
    </main>

    <footer class="site-footer"><span>© <span id="footer-year"></span> 日常博客</span><span id="footer-name"></span></footer>

    <div class="article-reader" id="article-reader" hidden>
      <div class="article-reader__bar"><button class="button button--line" id="article-close" type="button"><span data-icon="arrow-left"></span>返回列表</button><span id="article-category"></span></div>
      <article><p class="article-meta" id="article-meta"></p><h1 id="article-title"></h1><p class="article-excerpt" id="article-excerpt"></p><img id="article-cover" src="" alt="" /><div class="article-content" id="article-content"></div></article>
    </div>

    <div class="music-dock" id="music-dock">
      <button id="music-toggle" type="button" aria-label="播放音乐"><span data-icon="music"></span></button>
      <div><strong id="music-title"></strong><span id="music-artist"></span></div>
      <div class="music-progress"><span id="music-progress"></span></div>
      <time id="music-time">0:00</time>
    </div>
    <audio id="music-audio" preload="metadata"></audio>

    <div class="loading-screen"><span>D</span><p>正在加载日常博客</p></div>
    <script src="default-data.js"></script>
    <script src="daily.js"></script>
  </body>
</html>
