<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <meta name="description" content="刘琪硕的个人网站，记录生活、摄影、音乐与文字。">
  <title>刘琪硕 · 个人主页与日常博客</title>
  <link rel="icon" href="assets/images/avatar.jpg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header" id="site-header">
    <a class="brand" href="#home">
      <img src="assets/images/avatar.jpg" alt="刘琪硕头像">
      <span><strong>刘琪硕</strong><small>PERSONAL JOURNAL</small></span>
    </a>
    <nav class="site-nav" id="site-nav">
      <a href="#home">首页</a>
      <a href="#about">关于</a>
      <a href="#photos">照片</a>
      <a href="#projects">作品</a>
      <a href="#blog">博客</a>
      <a href="#contact">联系</a>
    </nav>
    <div class="header-actions">
      <button class="icon-button" id="theme-toggle" type="button" aria-label="切换深浅色"></button>
      <a class="button button--ghost" href="admin.html">管理</a>
      <button class="icon-button nav-menu-button" id="nav-menu-button" type="button" aria-label="打开导航">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="home">
      <div class="hero__copy">
        <p class="eyebrow" id="hero-title"></p>
        <h1><span id="hero-name"></span><small id="hero-tagline"></small></h1>
        <p id="hero-bio"></p>
        <div class="hero__actions">
          <a class="button button--primary" href="#photos">浏览照片</a>
          <a class="button button--secondary" href="#blog">阅读文章</a>
        </div>
        <div class="hero__meta">
          <span id="hero-location"></span>
          <a id="hero-email" href="#"></a>
          <span id="hero-douyin"></span>
        </div>
      </div>
      <div class="hero__avatar">
        <img id="hero-avatar" src="" alt="刘琪硕头像">
        <span><i></i><strong id="hero-availability"></strong></span>
      </div>
    </section>

    <section class="section" id="about">
      <header class="section-header">
        <p>ABOUT</p>
        <h2>关于我</h2>
      </header>
      <div class="about-grid">
        <article class="about-card">
          <p id="about-bio"></p>
        </article>
        <dl class="about-details">
          <div><dt>名字</dt><dd id="about-name"></dd></div>
          <div><dt>身份</dt><dd id="about-role"></dd></div>
          <div><dt>所在地</dt><dd id="about-location"></dd></div>
          <div><dt>邮箱</dt><dd id="about-email"></dd></div>
        </dl>
      </div>
    </section>

    <section class="section section--soft" id="photos">
      <header class="section-header section-header--split">
        <div><p>PHOTOS</p><h2>照片记录</h2></div>
        <span>用镜头留下那些值得回看的普通瞬间。</span>
      </header>
      <div class="photo-grid" id="photo-grid"></div>
    </section>

    <section class="section" id="projects">
      <header class="section-header section-header--split">
        <div><p>PROJECTS</p><h2>作品与内容</h2></div>
        <span>记录做过的网站、拍过的照片与持续整理的内容。</span>
      </header>
      <div class="project-grid" id="project-grid"></div>
    </section>

    <section class="section section--soft" id="blog">
      <header class="section-header section-header--split">
        <div><p>JOURNAL</p><h2>日常博客</h2></div>
        <span>生活、音乐、摄影和那些想留下来的想法。</span>
      </header>
      <div class="post-list" id="post-list"></div>
    </section>

    <section class="contact" id="contact">
      <div>
        <p>CONTACT</p>
        <h2>如果你也喜欢摄影、音乐或记录生活，欢迎聊聊。</h2>
        <span id="contact-email"></span>
      </div>
      <a class="button button--light" id="contact-link" href="#">发送邮件</a>
    </section>
  </main>

  <footer class="site-footer">
    <span>© <span id="footer-year"></span> 刘琪硕</span>
    <span>HTML · CSS · JavaScript</span>
  </footer>

  <div class="music-player" id="music-player">
    <button id="music-toggle" type="button" aria-label="播放音乐">▶</button>
    <div>
      <strong id="music-title"></strong>
      <span id="music-artist"></span>
    </div>
    <div class="music-progress"><i id="music-progress"></i></div>
    <time id="music-time">0:00</time>
  </div>
  <audio id="audio" preload="metadata"></audio>

  <div class="article-modal" id="article-modal" hidden>
    <article>
      <button class="modal-close" id="article-close" type="button" aria-label="关闭">×</button>
      <span id="article-category"></span>
      <h2 id="article-title"></h2>
      <p id="article-meta"></p>
      <img id="article-cover" src="" alt="">
      <div class="article-content" id="article-content"></div>
    </article>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <button id="lightbox-close" type="button" aria-label="关闭">×</button>
    <img id="lightbox-image" src="" alt="">
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
