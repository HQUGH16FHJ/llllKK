<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07090d" />
    <meta name="description" content="个人简历、项目作品与日常博客。" />
    <title>个人简历与博客</title>
    <link rel="icon" href="assets/profile.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="is-loading">
    <a class="skip-link" href="#main">跳到主要内容</a>
    <div class="scroll-progress" aria-hidden="true"><span></span></div>
    <div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>

    <header class="site-nav" id="site-nav">
      <a class="site-brand" href="#top">
        <span class="site-brand__mark" id="brand-mark">L</span>
        <span><strong id="brand-name">个人主页</strong><small>PORTFOLIO / JOURNAL</small></span>
      </a>
      <nav class="site-links" aria-label="导航">
        <a href="#about">关于</a>
        <a href="#resume">经历</a>
        <a href="#projects">项目</a>
        <a href="daily.html">日常博客</a>
        <a href="#contact">联系</a>
      </nav>
      <button class="nav-menu-button" id="nav-menu-button" type="button" aria-label="打开导航" aria-expanded="false">
        <span data-icon="menu"></span>
      </button>
    </header>

    <main id="main">
      <section class="profile-hero" id="top">
        <img class="profile-hero__backdrop" id="profile-backdrop" src="" alt="" />
        <span class="profile-hero__overlay" aria-hidden="true"></span>
        <span class="profile-hero__grid" aria-hidden="true"></span>
        <div class="profile-hero__copy">
          <p class="eyebrow reveal" id="profile-role"></p>
          <h1 class="reveal"><span id="profile-name"></span><small id="profile-tagline"></small></h1>
          <p class="hero-intro reveal" id="profile-intro"></p>
          <div class="hero-actions reveal">
            <a class="button button--accent" href="#projects">浏览项目 <span data-icon="arrow-down"></span></a>
            <button class="button button--line" id="print-button" type="button">打印简历 <span data-icon="download"></span></button>
          </div>
          <div class="hero-meta reveal">
            <span><i></i><span id="profile-location"></span></span>
            <a id="profile-email-link" href="#"><span id="profile-email"></span></a>
            <a id="profile-github-link" href="#" target="_blank" rel="noreferrer">GitHub</a>
          </div>
        </div>
        <div class="profile-hero__portrait reveal">
          <img id="profile-image" src="" alt="" />
          <span class="profile-hero__frame"></span>
          <div class="profile-hero__badge"><span>AVAILABLE FOR</span><strong id="profile-availability"></strong></div>
        </div>
      </section>

      <section class="section about-section" id="about">
        <header class="section-heading reveal"><span>01 / ABOUT</span><h2>关于我</h2></header>
        <div class="about-grid">
          <div class="about-copy reveal"><p id="about-text"></p><blockquote id="profile-quote"></blockquote></div>
          <div class="about-facts reveal">
            <div><span>方向</span><strong id="fact-focus"></strong></div>
            <div><span>地点</span><strong id="fact-location"></strong></div>
            <div><span>状态</span><strong id="fact-status"></strong></div>
          </div>
        </div>
      </section>

      <section class="section resume-section" id="resume">
        <header class="section-heading reveal"><span>02 / EXPERIENCE</span><h2>经历与教育</h2></header>
        <div id="resume-list"></div>
      </section>

      <section class="skills-section">
        <div class="section">
          <header class="section-heading reveal"><span>03 / SKILLS</span><h2>能力结构</h2></header>
          <div class="skills-grid" id="skills-grid"></div>
        </div>
      </section>

      <section class="section projects-section" id="projects">
        <header class="section-heading reveal"><span>04 / SELECTED WORK</span><h2>代表项目</h2></header>
        <div class="project-grid" id="project-grid"></div>
      </section>

      <section class="blog-section" id="blog">
        <div class="section">
          <header class="section-heading reveal"><span>05 / JOURNAL</span><h2>最近文章</h2></header>
          <div class="post-list" id="post-list"></div>
          <a class="blog-all-link" href="daily.html">进入日常博客 <span data-icon="arrow-right"></span></a>
        </div>
      </section>

      <section class="contact-section" id="contact">
        <div class="contact-section__inner reveal">
          <span>LET'S BUILD SOMETHING</span>
          <h2>有合适的项目、机会或想法，欢迎聊聊。</h2>
          <p id="contact-copy"></p>
          <div class="hero-actions">
            <a class="button button--accent" id="contact-email" href="#">发送邮件 <span data-icon="mail"></span></a>
            <a class="button button--dark" id="contact-website" href="#" target="_blank" rel="noreferrer">个人网站 <span data-icon="external"></span></a>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer"><span>© <span id="footer-year"></span> <span id="footer-name"></span></span><span>RESUME · PROJECTS · JOURNAL</span></footer>

    <div class="article-reader" id="article-reader" hidden>
      <div class="article-reader__bar"><button class="button button--line" id="article-close" type="button"><span data-icon="arrow-left"></span>返回</button><span id="article-category"></span></div>
      <article><p class="article-meta" id="article-meta"></p><h1 id="article-title"></h1><p class="article-excerpt" id="article-excerpt"></p><img id="article-cover" src="" alt="" /><div class="article-content" id="article-content"></div></article>
    </div>

    <div class="music-dock" id="music-dock">
      <button id="music-toggle" type="button" aria-label="播放音乐"><span data-icon="music"></span></button>
      <div><strong id="music-title"></strong><span id="music-artist"></span></div>
      <div class="music-progress"><span id="music-progress"></span></div>
      <time id="music-time">0:00</time>
    </div>
    <audio id="music-audio" preload="metadata"></audio>

    <div class="loading-screen"><span>L</span><p>正在加载个人主页</p></div>
    <script src="default-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
