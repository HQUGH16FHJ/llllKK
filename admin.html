<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07090d" />
    <meta name="robots" content="noindex,nofollow" />
    <title>内容管理</title>
    <link rel="icon" href="assets/profile.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="admin-body">
    <header class="admin-topbar">
      <a class="admin-brand" href="index.html"><span>L</span><div><strong>内容管理</strong><small>STATIC CMS</small></div></a>
      <div>
        <span id="admin-status">本地编辑模式</span>
        <button class="button button--line" id="export-data" type="button">导出 site.json</button>
        <button class="button button--light" id="save-data" type="button">保存到浏览器</button>
      </div>
    </header>

    <div class="admin-shell">
      <aside class="admin-sidebar">
        <nav>
          <button class="is-active" data-section="overview">总览</button>
          <button data-section="profile">个人资料</button>
          <button data-section="experience">经历</button>
          <button data-section="skills">能力</button>
          <button data-section="projects">项目</button>
          <button data-section="posts">文章</button>
          <button data-section="media">图片库</button>
        </nav>
        <p>静态模式：编辑后导出 site.json，再上传到 GitHub 的 data 文件夹即可更新线上网站。</p>
      </aside>

      <main class="admin-main">
        <section class="admin-section is-active" data-panel="overview">
          <header><div><p>OVERVIEW</p><h1>内容总览</h1></div><button class="button button--accent" data-add="posts">发布文章</button></header>
          <div class="admin-metrics">
            <article><span>经历</span><strong id="metric-experience">0</strong></article>
            <article><span>项目</span><strong id="metric-projects">0</strong></article>
            <article><span>文章</span><strong id="metric-posts">0</strong></article>
            <article><span>图片</span><strong id="metric-media">0</strong></article>
          </div>
          <div class="admin-overview">
            <article><img id="overview-image" src="" alt="" /><strong id="overview-name"></strong><p id="overview-role"></p></article>
            <article><h3>导出后更新网站</h3><p>点击右上角“导出 site.json”，把文件上传到 GitHub 的 data 文件夹，Cloudflare 会自动重新部署。</p></article>
          </div>
        </section>

        <section class="admin-section" data-panel="profile">
          <header><div><p>PROFILE</p><h1>个人资料</h1></div></header>
          <form class="admin-form" id="profile-form">
            <div class="form-grid">
              <label><span>姓名</span><input id="p-name" /></label><label><span>职位</span><input id="p-role" /></label>
              <label><span>邮箱</span><input id="p-email" type="email" /></label><label><span>所在地</span><input id="p-location" /></label>
              <label><span>GitHub</span><input id="p-github" type="url" /></label><label><span>个人网站</span><input id="p-website" type="url" /></label>
              <label><span>背景音乐名称</span><input id="p-music-title" /></label><label><span>音乐作者</span><input id="p-music-artist" /></label>
            </div>
            <label><span>一句话介绍</span><input id="p-tagline" /></label>
            <label><span>首页介绍</span><textarea id="p-intro" rows="3"></textarea></label>
            <label><span>关于我</span><textarea id="p-about" rows="5"></textarea></label>
          </form>
        </section>

        <section class="admin-section" data-panel="experience"><header><div><p>EXPERIENCE</p><h1>经历与教育</h1></div><button class="button button--accent" data-add="experience">添加经历</button></header><div class="admin-list" id="experience-list"></div></section>
        <section class="admin-section" data-panel="skills"><header><div><p>SKILLS</p><h1>能力分组</h1></div><button class="button button--accent" data-add="skills">添加分组</button></header><div class="admin-list" id="skills-list"></div></section>
        <section class="admin-section" data-panel="projects"><header><div><p>PROJECTS</p><h1>项目</h1></div><button class="button button--accent" data-add="projects">添加项目</button></header><div class="admin-gallery" id="projects-list"></div></section>
        <section class="admin-section" data-panel="posts"><header><div><p>ARTICLES</p><h1>文章管理</h1></div><button class="button button--accent" data-add="posts">新建文章</button></header><div class="admin-list" id="posts-list"></div></section>
        <section class="admin-section" data-panel="media"><header><div><p>MEDIA</p><h1>图片库</h1></div><button class="button button--accent" data-add="media">上传图片</button></header><div class="admin-gallery" id="media-list"></div></section>
      </main>
    </div>

    <dialog class="admin-dialog" id="editor-dialog">
      <form id="editor-form">
        <header><div><p id="editor-kicker">EDIT</p><h2 id="editor-title"></h2></div><button class="icon-button" type="button" data-close>关闭</button></header>
        <div class="editor-fields" id="editor-fields"></div>
        <footer><button class="button button--line" type="button" data-close>取消</button><button class="button button--accent" type="submit">保存</button></footer>
      </form>
    </dialog>

    <div class="admin-toast" id="admin-toast"></div>
    <input id="media-input" type="file" accept="image/*" hidden />
    <script src="default-data.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
